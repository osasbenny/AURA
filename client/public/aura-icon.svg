<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">AURA icon</title>
  <desc id="desc">An abstract letter A inside an open terracotta aura ring.</desc>
