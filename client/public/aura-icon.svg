    <path d="M29 69 45.7 29.5a2.5 2.5 0 0 1 4.6 0L67 69M36.7 55.4h22.6" fill="none" stroke="#3d2e22" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
